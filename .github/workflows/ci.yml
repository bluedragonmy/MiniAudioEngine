name: Tests and site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: C++ tests
        run: sh cpp/tests/run_tests.sh
      - name: JS tests (same cases as C++)
        run: |
          node site/js/dsp/aliasing.test.mjs
          node site/js/dsp/dsp.test.mjs
      - name: C++ and JS print identical results
        run: diff <(./build/test_dsp) <(node site/js/dsp/dsp.test.mjs)
        shell: bash

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
